project_id = "app-academia"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# ADR-005: sessão imediata no onboarding (RLS com auth.uid() sem tela de login).
enable_anonymous_sign_ins = true

[edge_runtime]
enabled = true
policy = "per_worker"

# Webhook chamado pelo provedor de WhatsApp (sem JWT); autenticado por x-webhook-token.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.orquestrador]
verify_jwt = true

[functions.cron-relatorio-semanal]
verify_jwt = true

