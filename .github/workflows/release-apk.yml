name: Release Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/release-apk.yml'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notas opcionais para incluir na GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Publish Signed APK (arm64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for var in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD \
            SUPABASE_URL \
            SUPABASE_ANON_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required secret: $var" >&2
              exit 1
            fi
          done

      - name: Compute version metadata
        id: version
        run: |
          RAW_VERSION=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '"\r')
          VERSION_NAME="${RAW_VERSION%%+*}"
          BUILD_NUMBER=$((100 + GITHUB_RUN_NUMBER))
          TAG_NAME="v${VERSION_NAME}-build.${BUILD_NUMBER}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/liftr-release.jks"
          chmod 600 "${{ runner.temp }}/liftr-release.jks"

      - name: Build signed Android arm64 APK
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/liftr-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Package APK and SHA-256 checksum
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "${{ runner.temp }}/liftr-arm64-release.apk"
          cd "${{ runner.temp }}"
          sha256sum liftr-arm64-release.apk > liftr-arm64-release.apk.sha256

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "${{ runner.temp }}/liftr-release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          TITLE="LIFTR v${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.build_number }})"
          if [ -n "$CUSTOM_NOTES" ]; then
            gh release create "$TAG" \
              "${{ runner.temp }}/liftr-arm64-release.apk" \
              "${{ runner.temp }}/liftr-arm64-release.apk.sha256" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --notes "$CUSTOM_NOTES" \
              --generate-notes
          else
            gh release create "$TAG" \
              "${{ runner.temp }}/liftr-arm64-release.apk" \
              "${{ runner.temp }}/liftr-arm64-release.apk.sha256" \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --generate-notes
          fi

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liftr-arm64-release-build-${{ steps.version.outputs.build_number }}
          path: |
            ${{ runner.temp }}/liftr-arm64-release.apk
            ${{ runner.temp }}/liftr-arm64-release.apk.sha256
          retention-days: 14
